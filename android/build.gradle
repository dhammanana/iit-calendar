// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.4'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    buildscript {
        configurations.all {
            resolutionStrategy {
                // Force all subprojects (including capgo-capacitor-updater which declares 8.13.0)
                // to use the root AGP version. This prevents the 'Type T not present' error
                // caused by AGP version mismatch at Gradle configuration time.
                force 'com.android.tools.build:gradle:8.9.1'
            }
        }
    }
}

// Modern registration syntax to avoid "task already exists" failures
tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
